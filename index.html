 <!DOCTYPE html>
<html>
<head> 
    <title>Abi's-cute-App6</title>  
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="stylesheet" href="w3.css">
    <link rel="stylesheet" href="w3-colors-flat.css">

    <style>
        body {
            margin: 0;
            text-align: center;
            font-family: Arial, sans-serif;
        }

        #content {
            padding: 20px;
        }

        /* Canvas styling */
        canvas {
            border: 2px solid black;
            background-color: white;
            width: 90vw;
            max-width: 350px;
            height: 250px;
            display: block;
            margin: 20px auto;
        }

        button {
            width: 90%;
            max-width: 350px;
            margin: 10px auto;
            display: block;
            padding: 12px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            margin-top: 20px;
            padding: 10px;
        }
    </style>
</head>

<body>

<div id="header" class="w3-container w3-flat-carrot">
    <h1>Abi's-cute-App6</h1>
</div>

<div id="content" class="w3-container">
    <p>The following code has been developed by students/researchers of the <strong>FRI DIY Diagnostics Stream</strong> at UT Austin. This is for demonstration purposes only.</p>
    
    <p><strong>WARNING: THIS CODE SHOULD NOT BE USED TO DIAGNOSE MEDICAL CONDITIONS.</strong></p>

    <!-- The Canvas -->
    <canvas id="myCanvas" width="350" height="250"></canvas>

    <!-- Controls/the buttons -->
    <button onclick="drawRectangle()">Draw Rectangle</button>
    <button onclick="writeName()">Write My Name</button>
    <button onclick="loadImage()">Load Image</button>
    <button onclick="clearCanvas()">Clear Canvas</button>
</div>

<footer class="w3-container w3-flat-carrot">
    <p>DIY Diagnostics</p>
</footer>

<script>
    // Show the modification date on load
    const docMod = document.lastModified;
    console.log("This file last modified: " + docMod);

    // Helper function to get canvas context safely
    function getContext() {
        const canvas = document.getElementById("myCanvas");
        return canvas.getContext("2d");
    }
//function to draw a blue rectangle
    function drawRectangle() {
        const ctx = getContext();
        ctx.fillStyle = "blue";
        ctx.fillRect(40, 40, 150, 100);
    }
//function to load my name
    function writeName() {
        const ctx = getContext();
        ctx.font = "24px Arial";
        ctx.fillStyle = "red";
        ctx.fillText("Abi Odu", 70, 200);
    }
//function to load an image
	function loadImage() {
    const canvas = document.getElementById("myCanvas"); // ← add this
    const ctx = getContext();
    const img = new Image();
    img.onload = function() {
        ctx.clearRect(0, 0, canvas.width, canvas.height); // ← now canvas is defined
        ctx.drawImage(img, 25, 25, 300, 180);
        console.log("Image loaded successfully!");
    };
    img.onerror = function() {
        alert("Failed to load image. Check your URL!");
        console.error("Could not load image at: " + img.src);
    };
    img.crossOrigin = "anonymous"; // ← helps with CORS on external images
    img.src = "https://pixabay.com/photos/present-gift-bow-ribbon-box-594940/";
}

//the function to clear the canvas
    function clearCanvas() {
        const canvas = document.getElementById("myCanvas");
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
</script>

</body>
</html>
